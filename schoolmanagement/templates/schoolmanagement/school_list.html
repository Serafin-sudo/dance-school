{% extends 'base_list.html' %}

{% block list-header %}
    <th>Nome</th>
    <th>Via</th>
    <th>Telefono</th>
    <th>Email</th>
    <th>Dettagli</th>
{% endblock %}

{% block list-body %}
    {% for object in object_list %}
        <tr>
            <td>{{ object.name }}</td>
            <td>{{ object.street }}</td>
            <td>{{ object.phone }}</td>
            <td>{{ object.email }}</td>
            <td><a href="{% url 'schoolmanagement:school-detail' object.id %}">mostra</a></td>
        </tr>
    {% endfor %}
{% endblock %}
