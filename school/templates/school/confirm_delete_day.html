{% extends "base.html" %}

{% block title %}Elimina Giorno?{% endblock %}

{% block content %}
<div>
    <h1>Elimina Giorno</h1>
    <p>Sei sicuro di voler eliminare il giorno <strong>{{ object.name }}</strong>? L'operazione è irreversibile</p>

    <form method="POST" action="">
        {% csrf_token %}
        <a href="javascript:history.back()" class="btn btn-secondary">Indietro</a>
        <button type="submit">Conferma</button>
    </form>
</div>
{% endblock %}
