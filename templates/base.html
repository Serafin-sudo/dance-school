{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <link href="{% static 'css/style.css' %}" rel="stylesheet">

    <title>{% block title %}VoulezVous Dance{% endblock %}</title>

</head>
<body>

    <header>

        <nav>

            <a href="{% url 'homepage' %}">
                <img src="{% static 'img/logo.png' %}" width="40" height="40" alt="VVDance">
            </a>

            <a href="{% url 'about' %}">About</a>
            
            <a href="{% url 'schoolmanagement:school-list' %}">Scuole</a>
            
            <a href="{% url 'corsi' %}">Corsi</a>

            <a href="{% url 'aule' %}">Aule</a>

            <a href="{% url 'giorni' %}">Giorni</a>

            <button type="button" id="open-register">Registrati</button>

            <button type="button" id="open-access">Accedi</button>

        </nav>

    </header>

    <main>

        <!-- Modal Registrazione -->
        <dialog id="register-modal">
            <form method="POST" action="">
                {% csrf_token %}
                <header class="modal-header">
                    <h5>Registrazione</h5>
                </header>
                <div class="modal-body">
                    <div>
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                    <div>
                        <label for="cognome">Cognome</label>
                        <input type="text" id="cognome" name="cognome" required>
                    </div>
                    <div>
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                </div>
                <footer class="modal-footer">
                    <button type="button" id="close-register" aria-label="Chiudi">Indietro</button>
                    <button type="submit">Registrati</button>
                </footer>
            </form>
        </dialog>

        <!-- Modal Acesso -->
        <dialog id="access-modal">
            <form method="POST" action="">
                {% csrf_token %}
                <header class="modal-header">
                    <h5>Accesso</h5>
                </header>
                <div class="modal-body">
                    <div>
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required>
                    </div>
                    <div>
                        <label for="password">Password</label>
                        <input type="text" id="password" name="password" required>
                    </div>
                </div>
                <footer class="modal-footer">
                    <button type="button" id="close-access" aria-label="Chiudi">Indietro</button>
                    <button type="submit">Accedi</button>
                </footer>
            </form>
        </dialog>

        <div class="container">
            {% block content %}
            {% endblock %}
        </div>

    </main>
    
    <footer>

        <p>+1 555 503 4455</p>
        <p>voulezvous@mail.com</p>

    </footer>

    <script>
        // Modal Registrazione
        const register_modal = document.getElementById('register-modal');
        document.getElementById('open-register').addEventListener('click', () => register_modal.showModal());
        document.getElementById('close-register').addEventListener('click', () => register_modal.close());
        // Modal Acesso
        const access_modal = document.getElementById('access-modal');
        document.getElementById('open-access').addEventListener('click', () => access_modal.showModal());
        document.getElementById('close-access').addEventListener('click', () => access_modal.close());
    </script>

</body>
</html>
